services:
  - type: web
    name: salon-abood
    env: node
    plan: free
    buildCommand: cd backend && npm install && cd ../frontend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://salon-abood.onrender.com
      - key: JWT_EXPIRE
        value: 7d
